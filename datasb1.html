<body>
  <header>
    <div class="brand">
      <h1>📊 Data Sub Bab 1</h1>
      <p>Rekap jawaban siswa dari hlm1-2 sampai hlm8</p>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn" href="h1.html" onclick="localStorage.setItem('KI_GO_TO','admin')">⬅ Dashboard Admin</a>
      <button class="btn primary" onclick="downloadExcel()">⬇ Export Excel</button>
<button class="btn primary" onclick="downloadPDF()">⬇ Download PDF</button>
<button class="btn" type="button" onclick="bukaSemua()">Buka Semua</button>
<button class="btn" type="button" onclick="tutupSemua()">Tutup Semua</button>
<button class="btn" onclick="hapusData()">🗑 Reset Semua Data</button>
    </div>
  </header>

  <main>
    <div class="summary">
      <div class="stat">
        <div class="label">Jumlah Siswa</div>
        <div class="value" id="totalSiswa">0</div>
      </div>

      <div class="stat">
        <div class="label">Total Halaman Terisi</div>
        <div class="value" id="totalHalaman">0</div>
      </div>

      <div class="stat">
        <div class="label">Update Terakhir</div>
        <div class="value" id="updateTerakhir" style="font-size:18px;">-</div>
      </div>
    </div>

    <div class="tools">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Cari nama, kelas, absen, email, atau halaman..."
        oninput="renderData()"
      >

      <select id="filterHalaman" class="filter-select" onchange="renderData()">
        <option value="">Semua halaman</option>
      </select>

      <button class="btn" type="button" onclick="bukaSemua()">Buka Semua</button>
      <button class="btn" type="button" onclick="tutupSemua()">Tutup Semua</button>
    </div>

    <div id="dataContainer"></div>
    <div id="printArea" class="print-area"></div>
<div id="pdfDownloadArea" class="pdf-download-area"></div>
  </main>

  <script>
    const DATA_GURU_SUBBAB1_KEY = "AGENT_LEC_DATA_SUBBAB1_V1";

    function escapeHtml(text){
      return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function loadData(){
      try{
        return JSON.parse(localStorage.getItem(DATA_GURU_SUBBAB1_KEY) || "{}");
      }catch(e){
        return {};
      }
    }

    function countJawaban(item){
      return Object.values(item.halaman || {}).reduce((total, h) => {
        return total + ((h.jawaban || []).length);
      }, 0);
    }

    function halamanTerakhir(item){
      const halaman = Object.values(item.halaman || {});
      if(!halaman.length) return "-";
      return halaman[halaman.length - 1].judul || "-";
    }

    function isiFilterHalaman(entries){
      const select = document.getElementById("filterHalaman");
      const nilaiSekarang = select.value;
      const set = new Set();

      entries.forEach((item) => {
        Object.values(item.halaman || {}).forEach((h) => {
          if(h.judul) set.add(h.judul);
        });
      });

      const halamanList = Array.from(set).sort();

      select.innerHTML = `<option value="">Semua halaman</option>` + halamanList.map((judul) => {
        return `<option value="${escapeHtml(judul)}">${escapeHtml(judul)}</option>`;
      }).join("");

      select.value = halamanList.includes(nilaiSekarang) ? nilaiSekarang : "";
    }

    function renderData(){
      const db = loadData();
      const container = document.getElementById("dataContainer");
      const entries = Object.values(db);

      const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
      const filterHalaman = document.getElementById("filterHalaman").value;

      isiFilterHalaman(entries);
      document.getElementById("filterHalaman").value = filterHalaman;

      let totalHalaman = 0;
      let updateTerakhir = "-";

      entries.forEach(item => {
        totalHalaman += Object.keys(item.halaman || {}).length;
        if(item.waktuUpdateTerakhir){
          updateTerakhir = item.waktuUpdateTerakhir;
        }
      });

      document.getElementById("totalSiswa").textContent = entries.length;
      document.getElementById("totalHalaman").textContent = totalHalaman;
      document.getElementById("updateTerakhir").textContent = updateTerakhir;

      const filtered = entries.filter((item) => {
        const id = item.identitas || {};
        const halaman = Object.values(item.halaman || {});
        const cocokHalaman = !filterHalaman || halaman.some(h => h.judul === filterHalaman);

        const text = [
          id.nama,
          id.kelas,
          id.absen,
          id.email,
          item.waktuUpdateTerakhir,
          ...halaman.map(h => h.judul),
          ...halaman.flatMap(h => (h.jawaban || []).flatMap(j => [j.label, j.jawaban]))
        ].join(" ").toLowerCase();

        return cocokHalaman && text.includes(keyword);
      });

      if(entries.length === 0){
        container.innerHTML = `
          <div class="empty">
            Belum ada data siswa yang masuk. Pastikan siswa sudah login dan mengisi halaman Sub Bab 1.
          </div>
        `;
        return;
      }

      if(filtered.length === 0){
        container.innerHTML = `

<script>
function formatFirebaseTime(value) {
  if (!value) return "-";

  if (value.toDate) {
    return value.toDate().toLocaleString("id-ID");
  }

  if (value.seconds) {
    return new Date(value.seconds * 1000).toLocaleString("id-ID");
  }

  return String(value);
}

function labelRapiSubBab1(label) {
  const map = {
    h1: "Pilihan hipotesis 1: arah reaksi pembentukan endapan AgCl",
    h1Reason: "Alasan hipotesis 1",
    h2: "Pilihan hipotesis 2: perubahan warna larutan Co²⁺",
    h2Reason: "Alasan hipotesis 2",
    h3: "Pilihan hipotesis 3: kondisi mencapai kesetimbangan",
    h3Reason: "Alasan hipotesis 3",

    selectedQuestions: "Rumusan masalah yang dipilih siswa",
    obs1: "Observasi percobaan 1",
    obs2: "Observasi percobaan 2",
    obs3: "Observasi perbandingan kedua reaksi",
    ans1: "Jawaban analisis 1",
    ans2: "Jawaban analisis 2",
    analysis: "Analisis hasil pengamatan/simulasi",
    finalConclusion: "Kesimpulan akhir siswa",
    matchHypothesis: "Kesesuaian hasil dengan hipotesis",
    reflection5: "Refleksi: perbedaan kesetimbangan homogen dan heterogen",
    confirmReflectionDone: "Konfirmasi membaca handout dan mengisi refleksi"
  };

  return map[label] || label;
}

function jawabanRapiSubBab1(value) {
  const map = {
    satuarah: "Reaksi cenderung berlangsung satu arah",
    duaarah: "Reaksi cenderung berlangsung dua arah",
    tidakbalik: "Perubahan warna hanya terjadi satu kali dan tidak dapat kembali",
    bolakbalik: "Perubahan warna dapat terjadi bolak-balik",
    tertutup: "Reaksi dapat mencapai kesetimbangan jika berlangsung dalam sistem tertutup",
    terbuka: "Reaksi dapat mencapai kesetimbangan meskipun sistem terbuka",
    on: "Ya / dicentang"
  };

  if (typeof value === "string" && map[value]) {
    return map[value];
  }

  if (typeof value === "object" && value !== null) {
    return JSON.stringify(value, null, 2);
  }

  return String(value ?? "");
}

function ubahJawabanKeArray(jawabanObj) {
  if (!jawabanObj) return [];

  const abaikan = [
    "_localUser",
    "_meta",
    "KI_Page7_LastResult"
  ];

  if (Array.isArray(jawabanObj)) {
    return jawabanObj
      .filter(item => !abaikan.includes(item.label))
      .map(item => ({
        label: labelRapiSubBab1(item.label),
        jawaban: jawabanRapiSubBab1(item.jawaban)
      }));
  }

  return Object.entries(jawabanObj)
    .filter(([label]) => !abaikan.includes(label))
    .map(([label, value]) => {
      return {
        label: labelRapiSubBab1(label),
        jawaban: jawabanRapiSubBab1(value)
      };
    });
}

async function ambilSnapshotJawabanSubBab1() {
  const hasil = new Map();

  // Ambil hanya data Sub Bab 1 dari koleksi utama.
  const answersSnapshot = await db
    .collection("answers")
    .where("subBab", "==", 1)
    .get();

  answersSnapshot.forEach((doc) => {
    hasil.set(doc.id, doc);
  });

  // Ambil cadangan dari koleksi lama, tetap hanya Sub Bab 1.
  const legacySnapshot = await db
    .collection("jawaban")
    .where("subBab", "==", 1)
    .get();

  legacySnapshot.forEach((doc) => {
    if (!hasil.has(doc.id)) {
      hasil.set(doc.id, doc);
    }
  });

  return Array.from(hasil.values());
}

async function sinkronFirebaseKeDashboardSubBab1() {
  const docs = await ambilSnapshotJawabanSubBab1();

  const hasil = {};

  docs.forEach((doc) => {
    const data = doc.data();

    const email =
      data.email ||
      data["e-mail"] ||
      data.siswa?.email ||
      "tanpa-email";

    const nama =
      data.nama ||
      data.name ||
      data.siswa?.nama ||
      data.siswa?.name ||
      "-";

    const kelas =
      data.kelas ||
      data.siswa?.kelas ||
      "-";

    const absen =
      data.absen ||
      data["no absen"] ||
      data.siswa?.absen ||
      "-";

    const pageKey =
      data.pageKey ||
      data.halamanKey ||
      data.halamanId ||
      doc.id.split("_").pop() ||
      doc.id;

    const judul =
      data.pageTitle ||
      data.judul ||
      data.halaman ||
      pageKey;

    const waktu =
      formatFirebaseTime(data.updatedAt || data.dibuatPada || data.createdAt || data.waktuSimpan);

    const jawabanArray = ubahJawabanKeArray(data.jawaban || data.answers);

    if (!hasil[email]) {
      hasil[email] = {
        identitas: {
          nama: nama,
          kelas: kelas,
          absen: absen,
          email: email
        },
        halaman: {},
        waktuUpdateTerakhir: waktu
      };
    }

    hasil[email].halaman[pageKey] = {
      judul: judul,
      waktuSimpan: waktu,
      jawaban: jawabanArray
    };

    hasil[email].waktuUpdateTerakhir = waktu;
  });

  localStorage.setItem("AGENT_LEC_DATA_SUBBAB1_V1", JSON.stringify(hasil));

  renderData();
}
